<section id="mock-panel" class="card quiz-panel" hidden><h2>모의고사</h2><div class="mock-settings"><label>과목<select id="mock-subject" class="study-select"></select></label><label>문제 수<select id="mock-count" class="study-select"><option>5</option><option selected>10</option><option>20</option><option>40</option></select></label></div><p id="mock-info" class="small-status"></p><button id="mock-start" class="btn btn-main">시험 시작</button><div id="mock-area"></div></section>
</div></main>
<script>
'use strict';
(()=> {
const CLIENT='850481385560-loama234q6sgfe03i1eqc7os2ihh5ii8.apps.googleusercontent.com';
const OWNER_HASH='02f455bdf3299a17dfd94eb2b643f339e07b66fcd8498ddf20ed1936e6fe7b93';
const SHEET='1fWPUeVKy2UQZCobmuHQQzZNxpGnsTnrDJOTm3SolEFw';
const SCOPE='openid email https://www.googleapis.com/auth/spreadsheets.readonly';
const $=id=>document.getElementById(id), E=(tag,t,cls)=>{const e=document.createElement(tag);if(t!==undefined)e.textContent=t;if(cls)e.className=cls;return e};
let token='',expiry=0,timer=0,client=null,notes=[],questions=[],mode='notes',subject=0,chapter=0,deck=[],right=0,answered=0,wrong={};
const topics=[
{name:'중소기업관계법령',chapters:['중소기업기본법','소상공인기본법','소상공인 보호 및 지원에 관한 법률','중소기업 기술혁신 촉진법','중소기업 인력지원 특별법','중소기업 사업전환 촉진에 관한 특별법','중소기업진흥에 관한 법률','벤처기업육성에 관한 특별법','벤처투자 촉진에 관한 법률','중소기업제품 구매촉진 및 판로지원에 관한 법률']},
{name:'경영학',chapters:['경영학의 기초','경영전략','마케팅(Marketing)','조직행위론','인적자원관리','생산관리','경영정보시스템(MIS)']},
{name:'회계학개론',groups:[['재무회계',0],['원가회계',13]],chapters:['회계 이론','재무상태 및 경영성과','현금 및 수취채권과 지급채무','금융자산','재고자산','유형자산','무형자산','부채','자본','수익과 비용','리스','재무제표','재무제표 비율분석','원가의 개념','제조간접원가','개별원가계산','종합원가계산','정상원가계산','표준원가계산','변동원가계산','활동기준원가계산','CVP분석','투자중심점의 성과평가']},
{name:'기업진단론',chapters:['기업진단','경영분석','재무비율분석','비용구조분석','질적 경영분석','기업부실 예측']},
{name:'조사방법론',chapters:['조사방법론의 시작','조사방법론의 순서 요약','조사설계','자료수집방법 결정','표본설계','시행','분석 및 활용']}
];
function msg(t){$('gate-status').textContent=t}
function locked(t){clearTimeout(timer);token='';expiry=0;notes=[];questions=[];wrong={};deck=[];$('paper').replaceChildren();$('subjects').replaceChildren();$('chapter-toc').replaceChildren();$('quiz-area').replaceChildren();$('mock-area').replaceChildren();$('app').hidden=true;$('gate').hidden=false;$('login').disabled=false;msg(t||'')}
function valid(){return token&&Date.now()<expiry}
async function get(url){if(!valid())throw Error('expired');const r=await fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok){let e=Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()}
function err(e){if(e.status===401||e.message==='expired')return '로그인이 만료되었습니다. 다시 로그인해 주세요.';if(e.status===403)return 'Google Sheets 접근이 거부되었습니다. 본인 계정으로 로그인하고 스프레드시트 읽기 권한을 허용했는지 확인해 주세요.';if(e.status===404)return '비공개 학습자료를 찾을 수 없습니다. 등록된 계정으로 로그인해 주세요.';return '자료를 불러오지 못했습니다. 다시 로그인해 주세요. ('+e.message+')'}
const hash=async str=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str))),b=>b.toString(16).padStart(2,'0')).join('');
function clean(v){return String(v??'').replace(/2026년 학습자료의\s*|교재 기준·법령 재확인|교재 기준|교재상|법령 개정 확인 필요|최신 법령 재확인|법령 재확인|시험법령 확인 필요/g,'').replace(/:\s*재확인\.?/g,'').replace(/\s*\[재확인\]/g,'').replace(/\s*:\s*\./g,'.').trim()}
async function load(){
 const base='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET+'/values:batchGet';
 const url=new URL(base);url.searchParams.append('ranges',"'경영지도사 필기노트'!A2:G");url.searchParams.append('ranges',"'경영지도사 문제은행'!A2:N");
 const data=await get(url.toString());const [n,q]=data.valueRanges||[];
 notes=(n?.values||[]).filter(r=>r[0]&&r[3]&&r[4]).map(r=>({id:String(r[0]),subject:String(r[1]),title:clean(r[3]),body:clean(r[4]),memo:clean(r[5]),chapter:String(r[6]||'')}));
 questions=(q?.values||[]).filter(r=>r[0]&&r[4]&&['객관식','암기카드'].includes(r[3])).map(r=>({id:String(r[0]),subject:String(r[1]),type:r[3],question:clean(r[4]),options:r.slice(5,9).map(clean),answer:r[3]==='객관식'?Number(r[9])-1:clean(r[9]),explanation:clean(r[10])})).filter(q=>q.type!=='객관식'||Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&q.options.length===4);
}
async function authorize(r){if(r.error){locked('Google 인증 실패: '+r.error);return}token=r.access_token;expiry=Date.now()+Math.max(0,Number(r.expires_in||3600)-30)*1000;try{
 const u=await get('https://openidconnect.googleapis.com/v1/userinfo');if(u.email_verified!==true||await hash(String(u.email||'').trim().toLowerCase())!==OWNER_HASH){locked('권한이 없습니다. 등록된 관리자 Google 계정으로 로그인해 주세요.');return}
 await load();try{wrong=JSON.parse(localStorage.getItem('mc-wrong-v1')||'{}')||{}}catch(e){wrong={}}
 $('gate').hidden=true;$('app').hidden=false;updateStatus();setupSelects();renderNotes();
 const p=new URLSearchParams(location.search);setMode(p.get('view')==='study'?'quiz':'notes');
 timer=setTimeout(()=>locked('로그인이 만료되었습니다. 다시 로그인해 주세요.'),Math.max(0,expiry-Date.now()));
 }catch(e){locked(err(e))}
}
$('login').onclick=()=>{if(!window.google?.accounts?.oauth2){msg('Google 로그인 모듈을 불러오는 중입니다. 잠시 후 다시 눌러 주세요.');return}try{if(!client)client=google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:SCOPE,include_granted_scopes:false,callback:authorize,error_callback:e=>locked(e.type==='popup_closed'?'로그인 창이 닫혔습니다. 다시 눌러 주세요.':'로그인 창을 열지 못했습니다. 팝업을 허용해 주세요.')});$('login').disabled=true;msg('Google 계정 인증 중…');client.requestAccessToken({prompt:'select_account'})}catch(e){locked('로그인을 시작하지 못했습니다. '+e.message)}};
$('logout').onclick=()=>{const t=token;locked('로그아웃되었습니다.');if(t&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(t,()=>{})};
$('reload').onclick=async()=>{if(!valid()){locked('다시 로그인해 주세요.');return}$('reload').disabled=true;try{await load();updateStatus();setupSelects();renderNotes();resetQuiz();$('mock-area').replaceChildren()}catch(e){locked(err(e))}finally{$('reload').disabled=false}};
function updateStatus(){$('data-status').textContent='관리자 인증 완료 · 필기노트 '+notes.length+'개 · 문제 '+questions.length+'개 · '+new Date().toLocaleTimeString('ko-KR')+' 동기화'}
function addEmphasis(el,s){const re=/(\d[\d,.]*(?:\s*(?:억 원|억원|만 원|만원|년|개월|일|명|%|배|원))|효율성|효과성|최다출자자|독립성|핵심 순서)/g;let end=0;for(const m of s.matchAll(re)){el.append(document.createTextNode(s.slice(end,m.index)),E('strong',m[0]));end=m.index+m[0].length}el.append(document.createTextNode(s.slice(end)))}
function formatted(text){const root=E('div');const lines=text.split(/\r?\n/);for(let i=0;i<lines.length;i++){let line=lines[i].trim();if(!line)continue;if(line.includes(' | ')){let table=E('table',undefined,'note-table'),wrap=E('div',undefined,'note-scroll');let first=true;while(i<lines.length&&lines[i].includes(' | ')){const tr=E('tr');for(const v of lines[i].split(' | ')){const td=E(first?'th':'td');addEmphasis(td,v.trim());tr.append(td)}table.append(tr);first=false;i++}i--;wrap.append(table);root.append(wrap);continue}if(/^[-•●▪·]\s*/.test(line)){let ul=E('ul');while(i<lines.length&&/^[-•●▪·]\s*/.test(lines[i].trim())){let li=E('li');addEmphasis(li,lines[i].trim().replace(/^[-•●▪·]\s*/,''));ul.append(li);i++}i--;root.append(ul);continue}let p=E(/^(예시|사례|예제)\s*[:：]/.test(line)?'div':'p',undefined,/^(예시|사례|예제)\s*[:：]/.test(line)?'note-example':undefined);addEmphasis(p,line);root.append(p)}return root}
function chapterNotes(s,c){return notes.filter(n=>n.subject===topics[s].name&&(n.chapter?n.chapter===topics[s].chapters[c]:c===0&&s<2))}
function choose(s,c){subject=s;chapter=c;renderNotes();$('paper').scrollIntoView({block:'start'})}
function renderNotes(){const side=$('subjects'),paper=$('paper'),toc=$('chapter-toc');side.replaceChildren();toc.replaceChildren();paper.replaceChildren();topics.forEach((t,si)=>{const b=E('button',String(si+1).padStart(2,'0')+' '+t.name,'subject-button'+(si===subject?' active':''));b.onclick=()=>choose(si,0);side.append(b);if(si!==subject)return;t.chapters.forEach((ch,ci)=>{const group=t.groups?.find(g=>g[1]===ci);if(group)side.append(E('div',group[0],'chapter-group'));const num=t.groups&&ci>=13?ci-12:ci+1;const c=E('button',String(num).padStart(2,'0')+' '+ch,'chapter-button'+(ci===chapter?' active':''));c.onclick=()=>choose(si,ci);side.append(c)})});const t=topics[subject];paper.append(E('div','제'+(subject+1)+'과목 · '+t.name,'paper-top'),E('h2',t.chapters[chapter]));const list=chapterNotes(subject,chapter);if(!list.length){paper.append(E('p','아직 등록된 필기노트가 없습니다.'));return}toc.append(E('h3','세부 학습 목차'));list.forEach((n,i)=>{const a=E('a',(i+1)+'. '+n.title);a.href='#note-'+i;toc.append(a);const sec=E('section',undefined,'note-unit');sec.id='note-'+i;sec.append(E('h3',(i+1)+'. '+n.title),formatted(n.body));if(n.memo){const memo=E('div',undefined,'note-memo');memo.append(E('strong','핵심 암기 포인트'),E('div',n.memo));sec.append(memo)}paper.append(sec)})}
function setupSelects(){for(const id of ['quiz-subject','mock-subject']){const select=$(id),old=select.value;select.replaceChildren(new Option('전체 과목',''));topics.forEach(t=>select.add(new Option(t.name,t.name)));if([...select.options].some(o=>o.value===old))select.value=old}}
function setMode(m){mode=m;for(const v of ['notes','quiz','wrong','mock'])$(v+'-tab').setAttribute('aria-selected',String(v===m));$('notes-panel').hidden=m!=='notes';$('quiz-panel').hidden=!['quiz','wrong'].includes(m);$('mock-panel').hidden=m!=='mock';$('quiz-title').textContent=m==='wrong'?'오답 복습':'랜덤 문제풀이';resetQuiz();updateMock()}
for(const v of ['notes','quiz','wrong','mock'])$(v+'-tab').onclick=()=>setMode(v);
function saveWrong(){try{localStorage.setItem('mc-wrong-v1',JSON.stringify(wrong))}catch(e){}}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pool(s,type){return questions.filter(q=>(!s||q.subject===s)&&q.type===type)}
function resetQuiz(){deck=[];right=answered=0;$('quiz-area').replaceChildren();$('start').textContent='문제 풀기';stats()}
function stats(){$('quiz-stat').textContent='이번 학습 '+right+' / '+answered+' 정답 · 저장된 오답 '+Object.keys(wrong).length+'개'}
$('quiz-subject').onchange=$('quiz-type').onchange=resetQuiz;
function record(q,ok){if(ok){right++;delete wrong[q.id]}else wrong[q.id]=true;answered++;saveWrong();stats();$('start').textContent='다음 문제'}
function answerChoices(q,form,name){q.options.forEach((o,i)=>{const label=E('label',undefined,'quiz-option'),input=E('input');input.type='radio';input.name=name;input.value=i;label.append(input,E('span',(i+1)+'. '+o));form.append(label)})}
$('start').onclick=()=>{if(!valid()){locked('다시 로그인해 주세요.');return}const area=$('quiz-area');area.replaceChildren();if(!deck.length)deck=shuffled(pool($('quiz-subject').value,$('quiz-type').value).filter(q=>mode!=='wrong'||wrong[q.id]));const q=deck.pop();if(!q){area.append(E('p','해당 조건의 문제가 없습니다.'));return}area.append(E('p',q.subject,'study-sub'),E('h4',q.question));const fb=E('div','','quiz-feedback');if(q.type==='암기카드'){const reveal=E('button','정답 보기','btn');area.append(reveal,fb);reveal.onclick=()=>{reveal.disabled=true;fb.textContent=q.answer+(q.explanation?'\n'+q.explanation:'');const yes=E('button','알고 있었음','btn'),no=E('button','틀렸음','btn');area.append(yes,no);yes.onclick=no.onclick=e=>{record(q,e.currentTarget===yes);yes.disabled=no.disabled=true}}}else{const form=E('form');answerChoices(q,form,'answer');const submit=E('button','정답 확인','btn btn-main');submit.type='submit';form.append(submit,fb);area.append(form);form.onsubmit=e=>{e.preventDefault();const checked=form.querySelector('input:checked');if(!checked){fb.textContent='답을 선택해 주세요.';return}const ok=Number(checked.value)===q.answer;fb.textContent=(ok?'정답입니다.':'오답입니다. 정답: '+(q.answer+1)+'번')+(q.explanation?'\n'+q.explanation:'');form.querySelectorAll('input,button').forEach(e=>e.disabled=true);record(q,ok)}}};
function updateMock(){const count=pool($('mock-subject').value,'객관식').length;$('mock-info').textContent='현재 출제 가능한 객관식 '+count+'문제';$('mock-start').disabled=!count}
$('mock-subject').onchange=updateMock;
$('mock-start').onclick=()=>{if(!valid()){locked('다시 로그인해 주세요.');return}const qs=shuffled(pool($('mock-subject').value,'객관식')).slice(0,Number($('mock-count').value));const a=$('mock-area');a.replaceChildren();if(!qs.length)return;const form=E('form');a.append(E('p','총 '+qs.length+'문제'),form);qs.forEach((q,i)=>{const s=E('section',undefined,'mock-q');s.append(E('h4',(i+1)+'. '+q.question));answerChoices(q,s,'m'+i);form.append(s)});const b=E('button','제출 및 채점','btn btn-main');b.type='submit';form.append(b);form.onsubmit=e=>{e.preventDefault();let score=0;const results=E('div');qs.forEach((q,i)=>{const checked=form.querySelector('input[name="m'+i+'"]:checked');const ok=checked&&Number(checked.value)===q.answer;if(ok){score++;delete wrong[q.id]}else wrong[q.id]=true;const r=E('div',undefined,'mock-result');r.append(E('strong',(i+1)+'. '+(ok?'정답':'오답')),E('p',q.question),E('p','정답: '+(q.answer+1)+'번 · '+q.options[q.answer]),E('p',q.explanation));results.append(r)});saveWrong();a.replaceChildren(E('h3',score+' / '+qs.length+' 정답'),E('p',Math.round(score/qs.length*100)+'점','mock-score'),results);stats();a.scrollIntoView({block:'start'})}};
})();
</script></body></html>
