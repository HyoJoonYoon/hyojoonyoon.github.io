ss="paper" id="paper"><div class="mobile-nav"><select id="chapter-select" aria-label="장 선택"></select></div><div class="breadcrumbs" id="breadcrumbs"></div><h2 class="part-title" id="part-title"></h2><p class="chapter" id="chapter-title"></p><div id="lessons"></div><div class="chapter-nav"><button id="prev">← 이전 장</button><button id="next">다음 장 →</button></div></main></div><footer><a href="./learning.html#study-materials" style="color:inherit">랜덤 문제풀이 및 오답 복습 →</a></footer><script id="note-data" type="application/json">[{"name":"중소기업관계법령","groups":[{"name":"","chapters":[{"name":"중소기업기본법","notes":[{"id":"p0s0","title":"1. 중소기업의 범위를 판단하는 기본 구조","html":"\u003csection class=\"lesson\" id=\"p0s0\">\u003ch2>1. 중소기업의 범위를 판단하는 기본 구조\u003c/h2>\u003caside class=\"callout\">\u003cb>핵심 순서\u003c/b>\u003cdiv>① 영리 목적 기업인지 등 대상 확인 → ② 주된 업종별 평균매출액 기준 → ③ 자산총액 기준 → ④ 소유·경영 독립성 기준을 함께 확인합니다.\u003c/div>\u003c/aside>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">판단축\u003c/th>\u003cth scope=\"col\">핵심 개념\u003c/th>\u003cth scope=\"col\">암기 메모\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>업종별 규모\u003c/td>\u003ctd>주된 업종에 따라 평균매출액 등 기준이 달라짐\u003c/td>\u003ctd>업종별 규모 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자산총액\u003c/td>\u003ctd>일반 영리기업은 자산총액이 \u003cstrong class=\"key\">5,000억 원 미만\u003c/strong>이어야 함\u003c/td>\u003ctd>\u003cstrong class=\"key\">5,000억 원 미만\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>독립성\u003c/td>\u003ctd>규모가 작아도 큰 기업의 지배를 받으면 기준을 못 맞출 수 있음\u003c/td>\u003ctd>주식·출자·관계기업 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>비영리적 조직 등\u003c/td>\u003ctd>일정한 사회적기업·협동조합 등도 법령이 정한 요건을 갖추면 대상이 됨\u003c/td>\u003ctd>조직 유형별 요건이 같지는 않음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>업종별 규모 기준: 1,500 / 1,000 / 800 / 600 / \u003cstrong class=\"key\">400억 원\u003c/strong> 그룹.\u003c/p>\u003c/section>"},{"id":"p0s1","title":"2. 독립성 기준: 30% + 최다출자자","html":"\u003csection class=\"lesson\" id=\"p0s1\">\u003ch2>2. 독립성 기준: 30% + 최다출자자\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>독립성 제한:\u003c/b> 자산총액 \u003cstrong class=\"key\">5,000억 원 이상\u003c/strong> 법인(법정 제외 대상은 별도)이 다른 기업의 주식 등을 \u003cstrong class=\"key\">30% 이상\u003c/strong> 직·간접 소유하면서 최다출자자인 경우 독립성 기준에 문제가 생깁니다.\u003c/li>\u003cli>최다출자자를 볼 때 법인의 임원, 개인의 친족 등 법령에 규정된 관계자의 지분을 합산할 수 있습니다. 구체적 합산 범위는 해당 조문에 따릅니다.\u003c/li>\u003cli>법령에 규정된 일부 벤처투자 관련 법인 등은 이 \u003cstrong class=\"key\">5,000억 원\u003c/strong> 법인 지분 판단에서 제외됩니다.\u003c/li>\u003cli>관계기업의 경우에도 지배·종속 관계를 고려한 평균매출액 기준을 확인합니다.\u003c/li>\u003c/ul>\u003caside class=\"callout\">\u003cb>학습용 예시\u003c/b>\u003cdiv>A법인(자산 \u003cstrong class=\"key\">8,000억 원\u003c/strong>)이 B의 주식 \u003cstrong class=\"key\">32%\u003c/strong>, A의 임원이 B의 \u003cstrong class=\"key\">8%\u003c/strong>를 가지고, 다른 C회사가 \u003cstrong class=\"key\">36%\u003c/strong>라면 A 측 합산 \u003cstrong class=\"key\">40%\u003c/strong>로 \u003cstrong class=\"key\">최다출자자\u003c/strong> 판단의 사례가 됩니다. 단, 법령의 다른 요건·예외도 모두 검토해야 합니다.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p0s2","title":"3. 사회적기업·협동조합 등과 소기업 구분","html":"\u003csection class=\"lesson\" id=\"p0s2\">\u003ch2>3. 사회적기업·협동조합 등과 소기업 구분\u003c/h2>\u003cul class=\"points\">\u003cli>사회적기업, 협동조합 및 관련 연합회, 소비자생활협동조합, 중소기업협동조합 등도 규정된 요건 아래 중소기업의 범위에 포함됩니다.\u003c/li>\u003cli>소기업은 중소기업 중 업종별 [별표 3]의 평균매출액 등 소기업 규모 기준에 맞는 기업이고, 중기업은 중소기업 중 소기업을 제외한 기업입니다.\u003c/li>\u003c/ul>\u003caside class=\"callout\">\u003cb>소기업 규모표\u003c/b>\u003cdiv>업종별 \u003cstrong class=\"key\">120억\u003c/strong>·\u003cstrong class=\"key\">80억\u003c/strong>·\u003cstrong class=\"key\">50억\u003c/strong>·\u003cstrong class=\"key\">30억\u003c/strong>·\u003cstrong class=\"key\">10억 원 이하\u003c/strong> 그룹.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p0s3","title":"4. 유예기간과 지배·종속 관계","html":"\u003csection class=\"lesson\" id=\"p0s3\">\u003ch2>4. 유예기간과 지배·종속 관계\u003c/h2>\u003cul class=\"points\">\u003cli>중소기업이 규모 확대 등으로 요건을 벗어나는 경우 원칙적으로 다음 연도부터 \u003cstrong class=\"key\">5년간\u003c/strong> 중소기업으로 보는 유예가 적용됩니다. 특정 합병, 요건의 재충족, 중소기업 재분류 등은 별도 예외가 있습니다.\u003c/li>\u003cli>지배기업과 종속기업은 원칙적으로 주식 \u003cstrong class=\"key\">30% 이상\u003c/strong> + \u003cstrong class=\"key\">최다출자자\u003c/strong> 여부를 중심으로 판단하되, 본인·친족·자회사 등의 지분을 합산하는 여러 유형이 규정되어 있습니다.\u003c/li>\u003cli>일부 벤처투자 관련 투자자 등의 지분 보유는 지배·종속 관계 판단에서 제외됩니다. 생성·변동 시점에 관한 예외도 있습니다.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p0s4","title":"5. 중소기업 판단 기간·매출액·자산총액","html":"\u003csection class=\"lesson\" id=\"p0s4\">\u003ch2>5. 중소기업 판단 기간·매출액·자산총액\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">주제\u003c/th>\u003cth scope=\"col\">핵심 요지\u003c/th>\u003cth scope=\"col\">주의\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>적용기간\u003c/td>\u003ctd>직전 사업연도 말일부터 \u003cstrong class=\"key\">3개월\u003c/strong> 경과 후 \u003cstrong class=\"key\">1년간\u003c/strong> 적용하는 것이 기본\u003c/td>\u003ctd>일부 지분변경 특별규정 존재\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기준 적정성 점검\u003c/td>\u003ctd>중소벤처기업부장관은 \u003cstrong class=\"key\">5년마다\u003c/strong> 기준의 적정성을 검토\u003c/td>\u003ctd>유예기간 \u003cstrong class=\"key\">5년\u003c/strong>과 혼동 금지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>평균매출액\u003c/td>\u003ctd>기본적으로 직전 \u003cstrong class=\"key\">3개 사업연도\u003c/strong> 총매출액÷3 (\u003cstrong class=\"key\">36개월\u003c/strong>인 경우)\u003c/td>\u003ctd>사업기간에 따라 환산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>신생·분할 등\u003c/td>\u003ctd>설립 시점과 사업 기간에 따라 \u003cstrong class=\"key\">12개월\u003c/strong> 또는 일수 환산\u003c/td>\u003ctd>사업기간별 환산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자산총액\u003c/td>\u003ctd>원칙: 직전 사업연도 말 재무상태표상 자산총계\u003c/td>\u003ctd>당해연도 창업·합병·분할 예외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>외국법인 자산 환산\u003c/td>\u003ctd>직전 \u003cstrong class=\"key\">5개 사업연도\u003c/strong> 평균환율 적용\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>"},{"id":"p0s5","title":"6. 확인자료 제출·정부와 중소기업자의 책무","html":"\u003csection class=\"lesson\" id=\"p0s5\">\u003ch2>6. 확인자료 제출·정부와 중소기업자의 책무\u003c/h2>\u003cul class=\"points\">\u003cli>중소기업 확인에 필요한 자료를 관련 정책 시행기관에 제출해야 할 수 있고, 중소벤처기업부장관은 관계 행정기관 등에 자료를 요청할 수 있습니다.\u003c/li>\u003cli>\u003cb>확인자료 예:\u003c/b> 상시근로자 수, 매출액, 납입자본금·자본잉여금, 자기자본, 자산총액, 주주·출자현황.\u003c/li>\u003cli>정부·지방자치단체는 중소기업 육성·지원정책을 수립·시행하며, 중소기업자는 기술개발·경영혁신·사회적 책임 등과 관련해 노력할 책무가 있습니다.\u003c/li>\u003cli>\u003cb>세부 정책 범주:\u003c/b> 창업 촉진, 경영합리화·기술향상, 판로, 중소기업 간 협력, 구조전환, 공정경쟁, 인력·국제화 지원 등.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p0s6","title":"7. 중소기업 육성 종합계획 및 연차보고","html":"\u003csection class=\"lesson\" id=\"p0s6\">\u003ch2>7. 중소기업 육성 종합계획 및 연차보고\u003c/h2>\u003ch3>정부의 지원 책무\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">의무·재량\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>소기업 경영개선·지방 중소기업 육성·청년·여성·장애인 활동 촉진\u003c/td>\u003ctd>시책 실시 의무\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법제·재정 조치 및 안정적 재원 확보\u003c/td>\u003ctd>의무\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지원·투자 확대\u003c/td>\u003ctd>노력 의무\u003c/td>\u003c/tr>\u003ctr>\u003ctd>금융자금 공급 및 신용보증 시책\u003c/td>\u003ctd>의무\u003c/td>\u003c/tr>\u003ctr>\u003ctd>세제 지원\u003c/td>\u003ctd>재량\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>계획 및 보고의 구분\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">주체\u003c/th>\u003cth scope=\"col\">주기·기한\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>육성 종합계획\u003c/td>\u003ctd>정부\u003c/td>\u003ctd>\u003cstrong class=\"key\">3년마다\u003c/strong> 수립·시행\u003c/td>\u003c/tr>\u003ctr>\u003ctd>육성계획\u003c/td>\u003ctd>정부\u003c/td>\u003ctd>매년 수립 · \u003cstrong class=\"key\">3월\u003c/strong>까지 예산과 함께 국회 제출\u003c/td>\u003c/tr>\u003ctr>\u003ctd>연차보고\u003c/td>\u003ctd>중소벤처기업부장관\u003c/td>\u003ctd>전년도 실적·성과 평가 · 정기국회 개회 전 국회 제출\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cul class=\"points\">\u003cli>종합계획 수립·변경 시 국무회의 심의(대통령령상 경미한 변경 제외).\u003c/li>\u003cli>\u003cb>종합계획 포함사항:\u003c/b> 기본목표·방향, 제도·법령, 경영합리화·기술, 판로, 협력, 구조 고도화, 공정경쟁·동반성장, 인력, 지방기업, 청년 채용·근속 환경 등.\u003c/li>\u003cli>연차보고를 위한 관계기관 협조 요청 가능.\u003c/li>\u003c/ul>\u003caside class=\"callout\">\u003cb>암기\u003c/b>\u003cdiv>종합계획 \u003cstrong class=\"key\">3년\u003c/strong> / 육성계획 \u003cstrong class=\"key\">3월\u003c/strong> / 연차보고 정기국회 개회 전.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p0s7","title":"8. 중소기업빅데이터플랫폼 및 지원사업 효율화","html":"\u003csection class=\"lesson\" id=\"p0s7\">\u003ch2>8. 중소기업빅데이터플랫폼 및 지원사업 효율화\u003c/h2>\u003cul class=\"points\">\u003cli>중소벤처기업부장관은 플랫폼을 구축·운영할 수 있다. 신청·접수·지원이력, 진행현황, 통계, 정보 제공 등을 관리한다. 관리 대상 사업 범위는 매년 \u003cstrong class=\"key\">3월\u003c/strong> \u003cstrong class=\"key\">31일\u003c/strong>까지 관계기관장과 협의하여 결정한다.\u003c/li>\u003cli>자료 보유·이용자는 장관과 미리 범위를 협의하고 그 범위 내에서 이용한다. 장관은 자료 연계 제공을 요청할 수 있으며 요청받은 기관은 특별한 사유가 없으면 따라야 한다.\u003c/li>\u003cli>\u003cb>자료 제공기관:\u003c/b> 국세청장(동의받은 과세정보: 매출·자산·손익·전자세금계산서 등), 고용노동부장관(피보험자 수, 월평균보수 합산액), 관세청장(동의받은 수출 신고정보), 중앙관서·기금관리주체·지자체(재정정보). 주민등록번호, 신용정보, 인증·확인정보 등도 요청 대상이다.\u003c/li>\u003cli>\u003cb>운영기관 지정 요건:\u003c/b> 박사 취득 후 법인에서 상근 중소기업 연구 \u003cstrong class=\"key\">5년 이상\u003c/strong>인 사람과 정보시스템 개발·관리·운영 \u003cstrong class=\"key\">3년 이상\u003c/strong>인 사람 각각 \u003cstrong class=\"key\">1명 이상\u003c/strong>, 기준에 맞는 설비. 운영비 전부 또는 일부 지원 가능.\u003c/li>\u003cli>\u003cb>효율화:\u003c/b> 범위·분류·평가기준 마련, 역할 분담·연계, 현황조사·평가, 제도개선·예산 의견, 중복 검토, 위탁기관 성과분석, 만족도 조사. 장관이 정책심의회 심의를 거쳐 방안을 확정하고 관계기관장은 사업에 반영해야 한다.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p0s8","title":"9. 중소기업정책심의회와 실태조사","html":"\u003csection class=\"lesson\" id=\"p0s8\">\u003ch2>9. 중소기업정책심의회와 실태조사\u003c/h2>\u003cul class=\"points\">\u003cli>정책심의회는 중소벤처기업부에 설치. 위원장인 중소벤처기업부장관 포함 \u003cstrong class=\"key\">30명 이내\u003c/strong>. 관계 중앙행정기관 차관·차관급 공무원 또는 장관이 위촉하는 전문가로 구성한다.\u003c/li>\u003cli>\u003cb>심의·조정:\u003c/b> 주요 정책, 둘 이상 중앙행정기관 관련 정책, 종합계획, 당해 육성계획과 전년도 성과평가, 효율화, 신설·변경사업 조정, 제도·법령 등. 실무조정회의를 두며 분과별 전문위원회는 둘 수 있다.\u003c/li>\u003cli>실태조사 주체는 정부(장관 아님). 매년 정기 조사 및 결과 공표 의무. 중소기업중앙회·관련 단체·기관에 위탁 가능. 인력·여성기업·장애인기업·소상공인·사업전환·기술통계 등 관련 조사 통합 가능.\u003c/li>\u003cli>통합 조사 시 매년 의견수렴을 거쳐 통합 실시계획 수립. 조사 목적·내용·주기, 공동 활용·항목 단순화·시기 단일화·대표성·신뢰성, 인력·비용, 조사기관, 기업 부담 경감 등을 고려한다.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p0s9","title":"10. 중소기업 옴부즈만","html":"\u003csection class=\"lesson\" id=\"p0s9\">\u003ch2>10. 중소기업 옴부즈만\u003c/h2>\u003ch3>소속 및 주요 업무\u003c/h3>\u003cul class=\"points\">\u003cli>중소벤처기업부장관 소속이나 업무는 독립적으로 수행한다. 규제 발굴·개선, 애로 해결, 고충처리, 개선 건의·권고, 조사·분석·평가 및 보고 등을 담당한다.\u003c/li>\u003c/ul>\u003ch3>위촉 절차\u003c/h3>\u003cdiv class=\"flow\">\u003cspan class=\"step\">중소벤처기업부장관 추천\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\u003cspan class=\"step\">규제개혁위원회 심의\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\u003cspan class=\"step\">국무총리 위촉\u003c/span>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">핵심 내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>임기\u003c/td>\u003ctd>\u003cstrong class=\"key\">3년\u003c/strong> · 1회 연임 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>활동 결과보고\u003c/td>\u003ctd>매년 \u003cstrong class=\"key\">1월\u003c/strong> 말까지 규제개혁위원회·국무회의·국회에 보고\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개선 권고\u003c/td>\u003ctd>기관장은 \u003cstrong class=\"key\">30일 이내\u003c/strong> 이행계획 제출 · 불이행 시 이유 통지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공표\u003c/td>\u003ctd>정당한 이유 없이 불이행하면 옴부즈만이 내용을 공표해야 함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>자격 및 신분\u003c/h3>\u003cul class=\"points\">\u003cli>\u003cb>자격:\u003c/b> 중소기업 대표·상근임원 \u003cstrong class=\"key\">5년 이상\u003c/strong>, 관련 단체 근무 \u003cstrong class=\"key\">10년 이상\u003c/strong>, 중앙행정기관장·지자체장급, 부교수급 이상, 판사·검사·변호사 \u003cstrong class=\"key\">10년 이상\u003c/strong> 또는 장관 인정 전문가 중 하나.\u003c/li>\u003cli>\u003cb>해촉 예외:\u003c/b> 직무 관련 금품·향응, 금고 이상 형 선고, 장기간 심신쇠약, 고의적 직무태만 등 중대한 사유.\u003c/li>\u003cli>국회의원·지방의회의원 겸직 금지.\u003c/li>\u003c/ul>\u003ch3>업무 지원 및 권리 보호\u003c/h3>\u003cul class=\"points\">\u003cli>전문위원은 장관이 옴부즈만 의견을 들어 임명·위촉. 의견제출자에 대한 불이익·차별 금지.\u003c/li>\u003cli>국민권익위원회에 고충민원 대리 신청 가능. 적극적 규제개선 관련 징계 감경·면제 건의 가능.\u003c/li>\u003cli>장관은 인력 파견 요청 및 행정·재정 지원 가능.\u003c/li>\u003c/ul>\u003caside class=\"callout\">\u003cb>암기\u003c/b>\u003cdiv>임기 \u003cstrong class=\"key\">3년\u003c/strong> · 1회 연임 / \u003cstrong class=\"key\">1월\u003c/strong> 말 보고 / \u003cstrong class=\"key\">30일\u003c/strong> 이행계획.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p0s10","title":"11. 전문연구평가기관·연구원·과태료","html":"\u003csection class=\"lesson\" id=\"p0s10\">\u003ch2>11. 전문연구평가기관·연구원·과태료\u003c/h2>\u003ch3>전문연구평가기관\u003c/h3>\u003cul class=\"points\">\u003cli>장관이 지정·운영 및 예산 범위 내 출연·보조 가능.\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>지정 요건\u003c/td>\u003ctd>법인, 정관상 중소기업 연구·평가 목적, 박사 취득 후 해당 법인 유형에서 상근 연구 \u003cstrong class=\"key\">5년 이상\u003c/strong> 전문인력 \u003cstrong class=\"key\">15명 이상\u003c/strong>, 평가 전담 조직·인력 요건 모두 충족\u003c/td>\u003c/tr>\u003ctr>\u003ctd>신청·지정\u003c/td>\u003ctd>최근 \u003cstrong class=\"key\">3년\u003c/strong> 실적(있는 경우), 인력·조직 현황 제출. 장관은 최근 \u003cstrong class=\"key\">3년\u003c/strong> 실적 고려 가능, 지정 사실 게시 의무\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지정기간\u003c/td>\u003ctd>\u003cstrong class=\"key\">3년 이내\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>거짓·부정 지정\u003c/td>\u003ctd>반드시 취소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기준 미달\u003c/td>\u003ctd>취소 가능 · \u003cstrong class=\"key\">30일 이내\u003c/strong> 시정기간 부여 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>취소 후\u003c/td>\u003ctd>취소 전 청문 의무 · 취소일부터 \u003cstrong class=\"key\">2년 이내\u003c/strong> 재지정 불가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>중소벤처기업연구원\u003c/h3>\u003cul class=\"points\">\u003cli>정부가 설립하는 법인, 정관에 따라 임직원 배치. 민법상 재단법인 규정 준용, 장관 지도·감독, 유사명칭 사용 금지.\u003c/li>\u003cli>조사·연구·교육·평가·정책건의·협력·용역·규제영향 분석·통계·출판·상담 등을 수행.\u003c/li>\u003c/ul>\u003ch3>중소기업 주간 및 과태료\u003c/h3>\u003cul class=\"points\">\u003cli>\u003cb>중소기업 주간:\u003c/b> 매년 \u003cstrong class=\"key\">5월\u003c/strong> 셋째 주. 유공자 표창·기념행사·진흥행사 가능.\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">위반 행위\u003c/th>\u003cth scope=\"col\">과태료\u003c/th>\u003cth scope=\"col\">부과·징수 주체\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>중소기업자가 아닌 자가 거짓 자료로 시책 참여\u003c/td>\u003ctd>\u003cstrong class=\"key\">500만원 이하\u003c/strong>\u003c/td>\u003ctd>시책실시기관의 장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>연구원 유사명칭 사용\u003c/td>\u003ctd>\u003cstrong class=\"key\">100만원 이하\u003c/strong>\u003c/td>\u003ctd>중소벤처기업부장관\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout\">\u003cb>암기\u003c/b>\u003cdiv>연구인력 \u003cstrong class=\"key\">5년\u003c/strong>·\u003cstrong class=\"key\">15명\u003c/strong> / 지정 \u003cstrong class=\"key\">3년 이내\u003c/strong> / 시정 \u003cstrong class=\"key\">30일 이내\u003c/strong> / 재지정 제한 \u003cstrong class=\"key\">2년\u003c/strong>.\u003c/div>\u003c/aside>\u003c/section>"}]},{"name":"소상공인기본법","notes":[]},{"name":"소상공인 보호 및 지원에 관한 법률","notes":[]},{"name":"중소기업 기술혁신 촉진법","notes":[]},{"name":"중소기업 인력지원 특별법","notes":[]},{"name":"중소기업 사업전환 촉진에 관한 특별법","notes":[]},{"name":"중소기업진흥에 관한 법률","notes":[]},{"name":"벤처기업육성에 관한 특별법","notes":[]},{"name":"벤처투자 촉진에 관한 법률","notes":[]},{"name":"중소기업제품 구매촉진 및 판로지원에 관한 법률","notes":[]}]}]},{"name":"경영학","groups":[{"name":"","chapters":[{"name":"경영학의 기초","notes":[{"id":"p1s0","title":"1. 경영학의 성격과 경영의 두 평가 지표","html":"\u003csection class=\"lesson\" id=\"p1s0\">\u003ch2>1. 경영학의 성격과 경영의 두 평가 지표\u003c/h2>\u003cul class=\"points\">\u003cli>경영학은 경영에 필요한 지식을 체계적으로 연구하는 학문이며, 사회과학·실천과학·응용과학의 성격을 지닙니다.\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">무엇을 보는가?\u003c/th>\u003cth scope=\"col\">쉬운 예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>효율성(Efficiency)\u003c/td>\u003ctd>투입된 자원과 산출의 관계 / 자원·비용의 낭비를 줄이는가?\u003c/td>\u003ctd>같은 성과를 더 적은 인력·시간으로 달성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효과성(Effectiveness)\u003c/td>\u003ctd>계획한 목표나 의도한 결과를 달성했는가?\u003c/td>\u003ctd>매출 목표 100을 실제로 달성했는가?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout\">\u003cb>암기\u003c/b>\u003cdiv>\u003cstrong class=\"key\">효율성\u003c/strong> = 자원 사용의 경제성(수단), \u003cstrong class=\"key\">효과성\u003c/strong> = 목표 달성 정도(결과). 효율적이라고 반드시 효과적인 것은 아닙니다.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p1s1","title":"2. 경영마인드와 행정마인드","html":"\u003csection class=\"lesson\" id=\"p1s1\">\u003ch2>2. 경영마인드와 행정마인드\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">경영마인드\u003c/th>\u003cth scope=\"col\">행정마인드\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>현실에 도전\u003c/td>\u003ctd>현실을 있는 그대로 받아들임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개혁을 통한 창조\u003c/td>\u003ctd>현상유지 관리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>먼 앞날을 계산\u003c/td>\u003ctd>눈앞의 손해·이익 계산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무엇을·왜를 질문\u003c/td>\u003ctd>언제·어떻게를 질문\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>"},{"id":"p1s2","title":"3. 독일 경영학과 미국 경영학","html":"\u003csection class=\"lesson\" id=\"p1s2\">\u003ch2>3. 독일 경영학과 미국 경영학\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>독일 경영학:\u003c/b> 상업학에서 발전해 경영경제학으로 이어졌으며, 학문적·이론적 측면을 강조합니다.\u003c/li>\u003cli>\u003cb>미국 경영학:\u003c/b> 산업발달·실무 문제에서 발전해 경영관리 연구로 이어졌으며, 실용주의적 측면을 강조합니다.\u003c/li>\u003c/ul>\u003caside class=\"callout\">\u003cb>한 줄 암기\u003c/b>\u003cdiv>독일 = 이론·학문 / 미국 = 실무·응용.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p1s3","title":"4. 경영관리 이론의 큰 흐름","html":"\u003csection class=\"lesson\" id=\"p1s3\">\u003ch2>4. 경영관리 이론의 큰 흐름\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">흐름\u003c/th>\u003cth scope=\"col\">대표 학자·이론\u003c/th>\u003cth scope=\"col\">핵심 시각\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>전통적 관리론\u003c/td>\u003ctd>테일러 · 포드 · 페이욜 · 베버\u003c/td>\u003ctd>생산성, 경제성, 구조 중심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인간관계론\u003c/td>\u003ctd>메이요 · 뢰슬리스버거\u003c/td>\u003ctd>인간관계·사회적 측면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근대적 조직론\u003c/td>\u003ctd>바너드 · 사이먼\u003c/td>\u003ctd>합리성과 관리, 조직 내 인간\u003c/td>\u003c/tr>\u003ctr>\u003ctd>현대적 이론\u003c/td>\u003ctd>시스템 · 상황 · 복잡성 이론\u003c/td>\u003ctd>조직을 환경·시스템과 함께 이해\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>"},{"id":"p1s4","title":"5. 테일러의 과학적 관리법","html":"\u003csection class=\"lesson\" id=\"p1s4\">\u003ch2>5. 테일러의 과학적 관리법\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>핵심 목적:\u003c/b> 작업을 과학적으로 분석하여 생산성을 높임. 시간연구와 동작연구로 표준작업·표준과업량을 정합니다.\u003c/li>\u003cli>\u003cb>대표 수단:\u003c/b> 공정한 과업 설정, 작업량에 따른 차별적 성과급, 시간·동작연구, 직능식 직장제도(전문화된 감독).\u003c/li>\u003cli>\u003cb>한계:\u003c/b> 작업과 인간을 지나치게 기계적으로 취급하고, 인간의 심리적·사회적 측면과 기업 내 이해관계의 복잡성을 간과했다는 비판.\u003c/li>\u003c/ul>\u003caside class=\"callout trap\">\u003cb>기출 함정\u003c/b>\u003cdiv>테일러의 차별적 성과급은 시간제 임금지급을 핵심으로 하는 제도가 아닙니다. ‘시간제 임금지급’은 옳지 않은 설명입니다.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p1s5","title":"6. 포드 시스템","html":"\u003csection class=\"lesson\" id=\"p1s5\">\u003ch2>6. 포드 시스템\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>핵심:\u003c/b> 부품의 표준화와 이동조립법(컨베이어)을 이용해 연속적인 대량생산을 추구합니다.\u003c/li>\u003cli>\u003cb>3S:\u003c/b> 전문화(Specialization) · 단순화(Simplification) · 표준화(Standardization).\u003c/li>\u003cli>\u003cb>주요 특징:\u003c/b> 이동조립법, 고임금·저가격 원리, 봉사주의, 자동화·비숙련공의 활용.\u003c/li>\u003cli>\u003cb>한계:\u003c/b> 작업의 기계화·단순화에 따른 노동 숙련 저하, 노동을 기계의 일부처럼 취급한다는 비판.\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">비교\u003c/th>\u003cth scope=\"col\">테일러 시스템\u003c/th>\u003cth scope=\"col\">포드 시스템\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>초점\u003c/td>\u003ctd>개별 작업·과업관리의 효율성\u003c/td>\u003ctd>생산 공정 전체의 연속 대량생산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 수단\u003c/td>\u003ctd>시간·동작연구 / 차별적 성과급\u003c/td>\u003ctd>컨베이어 이동조립 / 3S\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표어성 요약\u003c/td>\u003ctd>고임금·저노무비\u003c/td>\u003ctd>고임금·저가격\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공통 비판\u003c/td>\u003ctd>노동자의 인간적 측면 경시\u003c/td>\u003ctd>노동의 기계화·단순화\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>"},{"id":"p1s6","title":"7. 페이욜의 일반관리론","html":"\u003csection class=\"lesson\" id=\"p1s6\">\u003ch2>7. 페이욜의 일반관리론\u003c/h2>\u003cul class=\"points\">\u003cli>기업 전체 및 모든 조직의 보편적 관리활동을 중시. 경영활동 6가지: 기술(생산·가공), 상업(판매·구매), 재무(자본조달·운용), 회계(재무상태표·손익·재산평가), 보전(자산·종업원 보호), 관리.\u003c/li>\u003cli>\u003cb>관리 5요소:\u003c/b> 계획 → 조직 → 지휘 → 조정 → 통제(계조지조통). 실행은 포함되지 않는다.\u003c/li>\u003cli>\u003cb>14원칙:\u003c/b> 분업화, 권한과 책임, 규율, \u003cstrong class=\"key\">명령통일\u003c/strong>, \u003cstrong class=\"key\">지휘통일\u003c/strong>, 조직목표 우선, 공정보상, 집권화, 계층화, 질서와 순서, 공정, 고용보장, 자율권 부여, 협동심 부여.\u003c/li>\u003cli>\u003cstrong class=\"key\">명령통일\u003c/strong>은 한 상사에게만 지시받는 것, \u003cstrong class=\"key\">지휘통일\u003c/strong>은 하나의 목표에 한 지휘자와 한 계획을 적용하는 것. 집권화는 상황에 맞는 집권·분권 수준 유지이다.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p1s7","title":"8. 베버의 관료제론","html":"\u003csection class=\"lesson\" id=\"p1s7\">\u003ch2>8. 베버의 관료제론\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>권위의 정당성에 따른 지배 유형:\u003c/b> 전통적·카리스마적·합법적 지배. 관료제는 합법성과 합리성에 기초한다.\u003c/li>\u003cli>\u003cb>특징:\u003c/b> 계층제와 명령의 사슬, 규칙·법규에 의한 행정, 문서주의, 업무영역 전문성, 공사분리.\u003c/li>\u003cli>\u003cb>장점:\u003c/b> 전문화·구조화·예측가능성·안정성·합리성. 단점: 자발성·창의성 부족, 환경적응력 미흡, 매너리즘, 형식·절차·문서주의.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p1s8","title":"9. 인간관계론과 호손 실험","html":"\u003csection class=\"lesson\" id=\"p1s8\">\u003ch2>9. 인간관계론과 호손 실험\u003c/h2>\u003cul class=\"points\">\u003cli>\u003cb>메이요·뢰슬리스버거:\u003c/b> 과학적 관리법의 기계적 인간관에 반발. 비공식 집단, 사회적·심리적 요인, 민주적·참여적 관리를 중시한다.\u003c/li>\u003cli>\u003cb>주요 실험:\u003c/b> 조명실험(물리적 조건의 영향 제한적), 계전기 조립실험(심리적 조건 중요), 면접실험(사회적·심리적 조건이 생산성에 영향).\u003c/li>\u003cli>\u003cb>시사점:\u003c/b> 감정의 논리, 비공식 조직, 사회인 가설, 민주적 리더십. 한계: 공식조직 및 노사갈등 경시, 비공식 집단의 보편성 결여, 경제적 욕구 경시.\u003c/li>\u003cli>\u003cb>기출 함정:\u003c/b> 작업의 과학화·객관화·분업화는 테일러의 과학적 관리론이다.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p1s9","title":"10. 맥그리거의 X·Y이론","html":"\u003csection class=\"lesson\" id=\"p1s9\">\u003ch2>10. 맥그리거의 X·Y이론\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구분\u003c/th>\u003cth scope=\"col\">X이론\u003c/th>\u003cth scope=\"col\">Y이론\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>인간관\u003c/td>\u003ctd>부정적\u003c/td>\u003ctd>긍정적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일과 책임\u003c/td>\u003ctd>회피\u003c/td>\u003ctd>책임 수용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>동기부여\u003c/td>\u003ctd>금전적 유인\u003c/td>\u003ctd>자발적 동기부여\u003c/td>\u003c/tr>\u003ctr>\u003ctd>관리 방식\u003c/td>\u003ctd>감독·통제\u003c/td>\u003ctd>자율·협력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>창의성\u003c/td>\u003ctd>—\u003c/td>\u003ctd>창의적 문제해결\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout\">\u003cb>암기\u003c/b>\u003cdiv>X = 통제 중심 / Y = 자율 중심.\u003c/div>\u003c/aside>\u003c/section>"},{"id":"p1s10","title":"11. 버나드의 협동체계론","html":"\u003csection class=\"lesson\" id=\"p1s10\">\u003ch2>11. 버나드의 협동체계론\u003c/h2>\u003cul class=\"points\">\u003cli>조직목표와 개인목표의 상호균형을 추구. 협동시스템 전제요건 3가지: 공헌의욕·공통목적·의사소통(공공의).\u003c/li>\u003cli>\u003cb>권한수용설:\u003c/b> 권한의 근원은 상급자 지위가 아니라 구성원의 자발적 수용. 조직균형론: 능률성에 의한 대내적 균형, 유효성에 의한 대외적 균형.\u003c/li>\u003c/ul>\u003c/section>"},{"id":"p1s11","title":"12. 사이먼·마치의 의사결정론","html":"\u003csection class=\"lesson\" id=\"p1s11\">\u003ch2>12. 사이먼·마치의 의사결정론\u003c/h2>\u003cul class=\"points\">\u003cli>버나드 이론을 계승. 정보 불완전성과 인지적 한계로 제한된 합리성을 갖는 관리인은 최적보다 만족할 만한 대안을 선택한다. 권한수용설도 계승한다.\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">모형\u003c/th>\u003cth scope=\"col\">핵심 전제 및 특징\u003c/th>\u003cth scope=\"col\">선택 방식\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>합리모형\u003c/td>\u003ctd>충분한 자원·정보·예측능력\u003c/td>\u003ctd>최적 대안\u003c/td>\u003c/tr>\u003ctr>\u003ctd>만족모형 (사이먼·마치)\u003c/td>\u003ctd>제한된 합리성\u003c/td>\u003ctd>만족 가능한 대안\u003c/td>\u003c/tr>\u003ctr>\u003ctd>점증모형 (린드블롬)\u003c/td>\u003ctd>소수 대안·결과 분석, 목표 재조정 가능\u003c/td>\u003ctd>기존 정책의 부분적·순차적 개선\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout trap\">\u003cb>기출 함정\u003c/b>\u003cdiv>\u003cstrong class=\"key\">제한된 합리성\u003c/strong>은 버나드가 아니라 사이먼·마치.\u003c/div>\u003c/aside>\u003c/section>"}]},{"name":"경영전략","notes":[]},{"name":"마케팅(Marketing)","notes":[]},{"name":"조직행위론","notes":[]},{"name":"인적자원관리","notes":[]},{"name":"생산관리","notes":[]},{"name":"경영정보시스템(MIS)","notes":[]}]}]},{"name":"회계학개론","groups":[{"name":"재무회계","chapters":[{"name":"회계 이론","notes":[]},{"name":"재무상태 및 경영성과","notes":[]},{"name":"현금 및 수취채권과 지급채무","notes":[]},{"name":"금융자산","notes":[]},{"name":"재고자산","notes":[]},{"name":"유형자산","notes":[]},{"name":"무형자산","notes":[]},{"name":"부채","notes":[]},{"name":"자본","notes":[]},{"name":"수익과 비용","notes":[]},{"name":"리스","notes":[]},{"name":"재무제표","notes":[]},{"name":"재무제표 비율분석","notes":[]}]},{"name":"원가회계","chapters":[{"name":"원가의 개념","notes":[]},{"name":"제조간접원가","notes":[]},{"name":"개별원가계산","notes":[]},{"name":"종합원가계산","notes":[]},{"name":"정상원가계산","notes":[]},{"name":"표준원가계산","notes":[]},{"name":"변동원가계산","notes":[]},{"name":"활동기준원가계산","notes":[]},{"name":"CVP분석","notes":[]},{"name":"투자중심점의 성과평가","notes":[]}]}]},{"name":"기업진단론","groups":[{"name":"","chapters":[{"name":"기업진단","notes":[]},{"name":"경영분석","notes":[]},{"name":"재무비율분석","notes":[]},{"name":"비용구조분석","notes":[]},{"name":"질적 경영분석","notes":[]},{"name":"기업부실 예측","notes":[]}]}]},{"name":"조사방법론","groups":[{"name":"","chapters":[{"name":"조사방법론의 시작","notes":[]},{"name":"조사방법론의 순서 요약","notes":[]},{"name":"조사설계","notes":[]},{"name":"자료수집방법 결정","notes":[]},{"name":"표본설계","notes":[]},{"name":"시행","notes":[]},{"name":"분석 및 활용","notes":[]}]}]},{"name":"부록","groups":[{"name":"랜덤 모의고사","chapters":[{"name":"랜덤 모의고사","notes":[],"mockExam":true}]},{"name":"최신기출문제","chapters":[{"name":"2025년 기출문제","notes":[]},{"name":"정답 및 해설","notes":[]}]}]}]</script><script>
const DATA=JSON.parse(document.getElementById('note-data').textContent);let subject=0,chapter=0;const selected=DATA.map(()=>0),$=id=>document.getElementById(id);function flat(){return DATA[subject].groups.flatMap(g=>g.chapters.map((c,i)=>({...c,group:g.name,no:i+1})));}function title(c){return c.mockExam?c.name:String(c.no).padStart(2,'0')+' '+c.name;}function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;}function render(){const d=DATA[subject],list=flat(),c=list[chapter];document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',i===subject);t.setAttribute('aria-pressed',String(i===subject));});$('breadcrumbs').textContent='경영지도사 / '+d.name+(c.group?' / '+c.group:'');$('part-title').textContent=subject<5?'제'+(subject+1)+'과목. '+d.name:'부록';$('chapter-title').textContent=c.mockExam?'랜덤 모의고사':(c.group?c.group+' · ':'')+'제'+c.no+'장 '+c.name;const content=$('lessons');content.replaceChildren();if(c.mockExam){const e=el('div',null,'empty-note');e.append(el('strong','랜덤 모의고사'),el('span','과목과 문항 수를 선택하고, 시험을 제출한 뒤 점수와 정답·해설을 확인할 수 있습니다.'));const a=el('a','모의고사 시작 →','mock-link');a.href='./learning.html#mock-exam';e.append(a);content.append(e);}else if(c.notes.length){for(const n of c.notes){const t=document.createElement('template');t.innerHTML=n.html;content.append(t.content.cloneNode(true));}}else{const e=el('div',null,'empty-note');e.append(el('strong','아직 등록된 필기노트가 없습니다.'),el('span','해당 장의 학습을 진행하면 이곳에 내용을 추가합니다.'));content.append(e);}const toc=$('toc-body');toc.replaceChildren();let idx=0;for(const g of d.groups){if(g.name)toc.append(el('div',g.name,'group-title'));for(const c of g.chapters){const i=idx++,b=el('button',null,'chap-btn');b.type='button';b.setAttribute('aria-current',String(i===chapter));b.append(el('span',String(i===-1?'':g.chapters.indexOf(c)+1).padStart(2,'0'),'num'));const v=el('span',c.name,'chap-name');v.append(el('span',c.mockExam?'시험 응시':c.notes.length?'필기노트 '+c.notes.length+'개':'학습 예정','status'));b.append(v);b.onclick=()=>choose(i);toc.append(b);if(i===chapter&&c.notes.length){const sub=el('div',null,'subtoc');sub.append(el('div','세부 학습 목차','sub-label'));for(const n of c.notes){const a=el('a',n.title);a.href='#'+n.id;a.onclick=()=>{if(innerWidth<=800){$('toc-body').classList.add('collapsed');$('toc-toggle').textContent='펼치기';$('toc-toggle').setAttribute('aria-expanded','false');}sub.querySelectorAll('a').forEach(x=>x.classList.remove('current'));a.classList.add('current');};sub.append(a);}toc.append(sub);}}}const sel=$('chapter-select');sel.replaceChildren();list.forEach((c,i)=>sel.add(new Option((c.group?c.group+' / ':'')+title(c),i)));sel.value=chapter;$('prev').disabled=chapter===0;$('next').disabled=chapter===list.length-1;$('prev').textContent=chapter?'← '+list[chapter-1].name:'← 이전 장';$('next').textContent=chapter<list.length-1?list[chapter+1].name+' →':'다음 장 →';}function choose(i){chapter=i;selected[subject]=i;render();if(innerWidth<=800){$('toc-body').classList.add('collapsed');$('toc-toggle').textContent='펼치기';$('toc-toggle').setAttribute('aria-expanded','false');}window.scrollTo({top:0,behavior:'instant'});}document.querySelectorAll('.tab').forEach((b,i)=>b.onclick=()=>{subject=i;choose(selected[i]);});$('chapter-select').onchange=e=>choose(Number(e.target.value));$('prev').onclick=()=>choose(chapter-1);$('next').onclick=()=>choose(chapter+1);$('toc-toggle').onclick=()=>{const collapsed=$('toc-body').classList.toggle('collapsed');$('toc-toggle').textContent=collapsed?'펼치기':'접기';$('toc-toggle').setAttribute('aria-expanded',String(!collapsed));};render();</script></body></html>
